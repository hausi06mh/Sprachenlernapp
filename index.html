<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18a967">
<title>Lumi Romanian</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=18">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="brand" id="homeBrand" aria-label="Zur Lernübersicht"><img id="lumiLogo" alt="Lumi"><div><strong>Lumi</strong><span>ROMÂNĂ</span></div></button>
    <div class="stats"><span>🔥 <b id="streak">0</b></span><span>💎 <b id="gems">100</b></span><span>⚡ <b id="xp">0</b></span></div>
  </header>

  <main id="main"></main>

  <nav class="bottomNav" id="bottomNav">
    <button data-view="learn" class="active">🏠<span>Lernen</span></button>
    <button data-view="practice">🧠<span>Üben</span></button>
    <button data-view="words">📚<span>Wörter</span></button>
    <button data-view="progress">📈<span>Fortschritt</span></button>
  </nav>
</div>

<div id="lesson" class="lesson hidden" aria-hidden="true">
  <header class="lessonHeader">
    <button id="closeLesson" class="iconBtn" aria-label="Übung schließen">✕</button>
    <div class="progressTrack"><div id="lessonProgress"></div></div>
    <div class="lessonCount" id="lessonCount"></div>
  </header>
  <main id="exercise"></main>
</div>
<div id="toast" class="toast"></div>
<script src="data.js?v=18"></script>
<script src="content.js?v=18"></script>
<script src="app.js?v=18"></script>
</body>
</html>
