<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4caf73"><title>Lumi Romanian</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><header><button id="homeLogo" class="brand"><img src="assets/lumi.svg"><span>Lumi</span></button><div class="stats"><span>🔥 <b id="streak">0</b></span><span>💎 <b id="gems">100</b></span><span>⚡ <b id="xp">0</b></span></div></header>
