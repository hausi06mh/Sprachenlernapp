<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3eaf70">
  <title>Lumi – Rumänisch lernen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/lumi-192.png">
  <link rel="stylesheet" href="styles.css?v=6.0.0">
</head>
<body>
<div class="app">
  <header>
    <button id="homeLogo" class="brand"><img src="assets/lumi.png?v=6" alt="Lumi"><span><b>Lumi</b><em>Lerne Rumänisch. Echt. 🇷🇴</em></span></button>
    <div class="stats"><span>🔥 <b id="streak">0</b></span><span>💎 <b id="gems">100</b></span><span>⚡ <b id="xp">0</b></span></div>
  </header>
  <main>
    <section id="screenPath" class="screen">
      <div class="welcome">
        <div><span class="eyebrow">DEUTSCH → RUMÄNISCH</span><h1>Schritt für Schritt sicher sprechen</h1><p>Beginne mit den Grundlagen. Jede Lektion baut auf der vorherigen auf und wird allmählich anspruchsvoller.</p></div>
        <img src="assets/lumi.png" alt="Lumi, der Karpatenluchs">
      </div>
      <div id="voiceBanner" class="voiceBanner"></div>
      <div class="goal"><div><b>Heutiges Ziel</b><span id="goalText">0 / 15 Minuten</span></div><div class="progress"><i id="goalBar"></i></div></div>
      <div class="overview"><div><b id="courseProgress">0 von 180</b><span>Lernpunkte geschafft</span></div><button id="voiceSettings">🔊 Stimme prüfen</button></div>
      <button id="continueCourse" class="continueCard"><span>▶</span><div><b>Weiterlernen</b><small id="continueText">Grundlagen · Lektion 1</small></div><strong>Los</strong></button>
      <div class="hubGrid">
        <button id="dialoguesBtn" class="hubCard"><span>💬</span><b>Dialoge</b><small>Alltagssituationen üben</small></button>
        <button id="storiesBtn" class="hubCard"><span>📖</span><b>Geschichten</b><small>Lesen, hören, verstehen</small></button>
        <button id="grammarBtn" class="hubCard"><span>🧩</span><b>Grammatik</b><small>Einfach auf Deutsch erklärt</small></button>
        <button id="reviewBtn" class="hubCard"><span>🎯</span><b>Fehlertraining</b><small>Schwache Wörter wiederholen</small></button>
      </div>
      <div id="course"></div>
    </section>

    <section id="screenLesson" class="screen hidden">
      <div class="lessonTop"><button id="quitLesson" aria-label="Lektion verlassen">✕</button><div class="progress"><i id="lessonProgress"></i></div><span id="hearts">❤ 5</span></div>
      <div id="exercise"></div>
    </section>

    <section id="screenDone" class="screen hidden">
      <div class="doneCard"><img src="assets/lumi.png" alt="Lumi"><span class="eyebrow">LEKTION BEENDET</span><h1 id="doneTitle">Sehr gut!</h1><p id="doneText"></p><div class="rewardGrid"><div><b id="doneScore">0%</b><span>Trefferquote</span></div><div><b id="doneXp">+0 XP</b><span>Belohnung</span></div></div><button class="primary" id="doneContinue">Weiter im Lernpfad</button></div>
    </section>
  </main>
  <nav><button data-nav="path" class="active">🏠<span>Lernen</span></button><button id="practiceBtn">🧠<span>Üben</span></button><button id="wordsBtn">📖<span>Wörter</span></button><button id="dialoguesNav">💬<span>Dialoge</span></button><button id="profileBtn">📊<span>Fortschritt</span></button></nav>
</div>
<div id="modal" class="modal hidden"><div class="modalCard"><button id="closeModal" aria-label="Schließen">✕</button><div id="modalBody"></div></div></div>
<div id="wordTip" class="wordTip hidden"></div><div id="toast"></div>
<script src="data.js?v=6.0.0"></script><script src="content.js?v=6.0.0"></script><script src="app.js?v=6.0.0"></script>
</body></html>
